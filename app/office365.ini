[Application]
ID = office365
Logo = ucs_logo.svg
LogoDetailPage = office_detail_logo.svg
Code = OF
Name = Microsoft 365 Connector
Version = 6.3
MinPhysicalRAM = 256
NotifyVendor = True
Description = Single Sign-On to Microsoft 365 for Nubus users
LongDescription = <p>
	<a href="https://products.office.com/en/business/">Microsoft 365 is built for your business</a>.
	<br>
	</p>
	<p>
	The Microsoft 365 Nubus connector allows to easily provision Microsoft 365 user accounts with single sign-on from the Univention Nubus IAM for UCS. Utilizing the Univention Nubus identity management features, selected Nubus accounts are automatically added, updated or deleted in your Microsoft 365 business account.
	</p>
	<p>
	Users log in with their Nubus username and password and can immediately use the Microsoft 365 collaboration features. Using Keycloak based single sign-on of Nubus to log into Microsoft 365, the user password never leaves the Nubus for UCS domain.
	</p>
	<p>
	This app is intended for organisations that want to manage their users with Nubus for UCS and give them access to Microsoft 365 features or to associated licences for Microsoft desktop software. To setup the integration, an Azure Active Directory and Microsoft 365 (test-)subscription is required.
	</p>
Thumbnails = thumbnail_8.png, thumbnail_9.png
Categories = Collaboration, Education
License = freemium
Vendor = Univention GmbH
WebsiteVendor = https://www.univention.com/
SupportURL = http://www.univention.com/products/support/enterprise-support/
Contact = sales@univention.de
DefaultPackages = univention-management-console-module-office365, python3-univention-office365, univention-office365
ServerRole = domaincontroller_master, domaincontroller_backup
UCSOverviewCategory = False
UserActivationRequired = True
UMCModuleName = office365
ApplianceCreate = False
Website = https://docs.software-univention.de/manual/5.2/en/idm-cloud/office-365.html
AppCategories = Office, Collaboration & Groupware, Mail & Messaging, Education, Identity Management
SupportedUcsVersions =
NotificationEmail = appcenter-reporting@univention.de
SupportType = univention
RequiredAppsInDomain = keycloak

[de]
Description = Single-Sign-On in Microsoft 365 für Nubus Benutzer
LongDescription = <p>
	<a href="https://products.office.com/en/business/">Microsoft 365 - auf Ihr Unternehmen zugeschnitten</a>.
	</p>
	<p>
	Der Microsoft 365 Connector für Nubus ermöglicht es, einen Office Zugang mit Single-Sign-On für Nutzerkonten aus dem Univention Nubus IAM von UCS zu provisionieren. Durch Verwenden der Nubus Identitymanagement Features werden ausgewählte Nubus Nutzerkonten automatisch dem Microsoft 365 Azure Account hinzugefügt, aktualisiert oder gelöscht.
	</p>
	<p>
	Benutzer melden sich mit ihrem Nubus Benutzernamen und Passwort an und können sofort die Microsoft 365 Features nutzen. Durch das Einbinden des Keycloak basierten Single-Sign-On von Nubus für den Login verlässt das Benutzerpasswort niemals die Nubus Domäne von UCS.
	</p>
	<p>
	Diese App ist für Organisationen geeignet, die den in Nubus für UCS gemanagten Nutzern Zugriff auf die Funktionen von Microsoft 365 oder die damit verbundenen Lizenzen für Microsoft Office Desktop Software geben wollen. Um den Connector in Betrieb zu nehmen, ist ein Azure Active Directory und eine Microsoft 365 (Test-)Subskription erforderlich.
	</p>
WebsiteVendor = https://www.univention.de/
SupportURL = http://www.univention.de/produkte/support/enterprise-support/
Thumbnails = thumbnail_10.png, thumbnail_11.png
Website = https://docs.software-univention.de/manual/5.2/de/idm-cloud/office-365.html
Name = Microsoft 365 Connector

