include:
  - component: "$CI_SERVER_FQDN/univention/dev/tooling/ci-components/ai-review@2.8.1"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

stages:
  - test
  - import
  - build

variables:
  PACKAGE: univention-office365
  UCS_VERSION: "520"
  UCS_RELEASE: "5.2"
  SCOPE: "office365"
  LANG: "C.UTF-8"
  DEBIAN_FRONTEND: noninteractive
  CI_REGISTRY: docker-registry.knut.univention.de
  IMAGE_UCSDEV: $CI_REGISTRY/phahn/ucs-debbase:$UCS_VERSION
  IMAGE_UCSLINT: $CI_REGISTRY/ucslint:522
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: none
  GIT_DEPTH: "3"

build_package:
  stage: test
  image: $IMAGE_UCSDEV
  before_script:
    - apt-get -q --assume-yes build-dep .
  script:
    - dpkg-buildpackage
    - install -d -m 755 build
    - mv ../*.tar.*z ../*.dsc ../*.deb ../*.buildinfo ../*.changes build/
  artifacts:
    paths:
      - build/

run_ucslint:
  stage: test
  image:
    name: $IMAGE_UCSLINT
    entrypoint: [""]
  script:
    - ucslint -j ucslint.xml -x 20
  artifacts:
    reports:
      junit: ucslint.xml

repo_admin:
  stage: import
  variables:
    GIT_STRATEGY: none  # disables `git clone` altogether
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip-build/ || $pipeline =~ /skip-build/"
      when: never
    - if: $CI_COMMIT_BRANCH == $UCS_RELEASE
      changes:
        - debian/changelog
  tags:
    - omar
  script:
    - >
      repo_admin.py
      -G $CI_REPOSITORY_URL
      -b $CI_COMMIT_BRANCH
      -P .
      -r ${UCS_RELEASE}-0-0
      -s $SCOPE
      -p $PACKAGE

build-package-ng:
  stage: build
  needs:
    - job: repo_admin
      artifacts: false
  variables:
    GIT_STRATEGY: none  # disables `git clone` altogether
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip-build/ || $pipeline =~ /skip-build/"
      when: never
    - if: $CI_COMMIT_BRANCH == $UCS_RELEASE
      changes:
        - debian/changelog
  tags:
    - ladda
  script:
    - >
      build-package-ng
      --no-pbuilder-update
      -r ${UCS_RELEASE}-0-0
      -s $SCOPE
      -p $PACKAGE

sonarqube:
  stage: test
  tags:
    - dm-m
  image:
    name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/sonarsource/sonar-scanner-cli:11
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    GIT_STRATEGY: clone

  cache:
    policy: pull-push
    key: "sonar-cache-$CI_COMMIT_REF_SLUG"
    paths:
      - "${SONAR_USER_HOME}/cache"
      - sonar-scanner/

  script:
    - sonar-scanner -Dsonar.host.url="${SONAR_HOST_URL}"
  allow_failure: true
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /skip-sonarqube/ || $pipeline =~ /skip-sonarqube/"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_REF_PROTECTED == "true"
    - if: "$CI_COMMIT_MESSAGE =~ /force-sonarqube/ || $pipeline =~ /force-sonarqube/"
